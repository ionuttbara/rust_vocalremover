[package]
name = "rustvocalremover"
version = "0.2.2"
edition = "2021"
build = "build.rs"
description = "AI vocal remover with Slint GUI and Explorer Actions"

[features]
default = []
integrated = [] # Build with uvr-mdx-hq-3.onnx embedded in the executable.

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
num-complex = "0.4"
ort = { version = "2.0.0-rc.12", features = ["cuda", "directml", "ndarray"] }
rfd = "0.15"
rustfft = "6.2"
slint = { version = "1.17.1", features = ["unstable-winit-030"] }
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac", "isomp4"] }
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation"
] }
winreg = "0.52"

[build-dependencies]
winresource = "0.1.31"
